name: Makefile CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Go environment
      uses: actions/setup-go@v7.0.0
      with:
        go-version: stable
        cache-dependency-path: miwigu/wstoudp/go.sum

    - name: Setup Rust and the aarch64 cross toolchain
      run: |
        rustup toolchain install stable --profile minimal
        rustup target add aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross

    - name: Cache Cargo build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: miwigu/wg_host/tunn_ffi

    - name: Run check
      run: make check

    # -B rebuilds the libraries in dist/ even though checked-in copies exist.
    - name: Build
      run: make -B all

    - name: Upload build outputs
      uses: actions/upload-artifact@v4
      with:
        name: miwigu-build
        path: |
          bin/
          miwigu/wg_host/dist/
          app.zip
